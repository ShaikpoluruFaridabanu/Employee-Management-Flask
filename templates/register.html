{% extends "base.html" %}


{% block title %}

Register

{% endblock %}


{% block content %}


<section class="register-section">


    <div class="register-card">


        <div class="register-icon">
            👥
        </div>


        <h1>
            Register
        </h1>


        {% if error %}

        <p class="error">
            {{ error }}
        </p>

        {% endif %}


        <form method="POST">


            <label>
                Username
            </label>


            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>
                Email
            </label>


            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >


            <label>
                Password
            </label>


            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <label>
                Confirm Password
            </label>


            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm password"
                required
            >


            <button type="submit">

                Register

            </button>


        </form>


        <p class="already-account">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>


    </div>


</section>


{% endblock %}
