<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}
        Employee Management
        {% endblock %}

    </title>


    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<nav class="navbar">
    <div class="logo">
        <span class="logo-icon" aria-hidden="true">👥</span>
        <span>Employee</span>
    </div>

    <button class="menu-toggle"
            id="menu-toggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="nav-links">
        <span class="menu-icon" aria-hidden="true">☰</span>
    </button>

    <div class="nav-links" id="nav-links">
        {% if session.get("logged_in") %}
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('add_employee') }}">Add Employee</a>
            <a href="{{ url_for('view_employees') }}">View</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        {% else %}
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('contact') }}">Contact</a>
            <a href="{{ url_for('login') }}">Login</a>
        {% endif %}
    </div>
</nav>


<main class="page-content">

    {% block content %}

    {% endblock %}

</main>


<footer>

    © 2026 Employee Management System

</footer>


<script>
    (function () {
        const menuToggle = document.getElementById("menu-toggle");
        const navLinks = document.getElementById("nav-links");

        if (!menuToggle || !navLinks) return;

        menuToggle.addEventListener("click", function () {
            const isOpen = navLinks.classList.toggle("active");
            menuToggle.setAttribute("aria-expanded", String(isOpen));
            menuToggle.setAttribute(
                "aria-label",
                isOpen ? "Close navigation menu" : "Open navigation menu"
            );
            menuToggle.querySelector(".menu-icon").textContent = isOpen ? "✕" : "☰";
        });

        // Close the mobile menu after selecting a navigation link.
        navLinks.querySelectorAll("a").forEach(function (link) {
            link.addEventListener("click", function () {
                navLinks.classList.remove("active");
                menuToggle.setAttribute("aria-expanded", "false");
                menuToggle.setAttribute("aria-label", "Open navigation menu");
                menuToggle.querySelector(".menu-icon").textContent = "☰";
            });
        });

        // Reset menu state when moving back to desktop width.
        window.addEventListener("resize", function () {
            if (window.innerWidth > 768) {
                navLinks.classList.remove("active");
                menuToggle.setAttribute("aria-expanded", "false");
                menuToggle.setAttribute("aria-label", "Open navigation menu");
                menuToggle.querySelector(".menu-icon").textContent = "☰";
            }
        });
    })();
</script>

</body>

</html>
