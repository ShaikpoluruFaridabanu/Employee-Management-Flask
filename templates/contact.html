{% extends "base.html" %}

{% block title %}
Contact
{% endblock %}

{% block content %}

<section class="contact-section">

    <div class="contact-card">

        <h1>Contact Us</h1>

        {% if success %}
        <p class="success">
            {{ success }}
        </p>
        {% endif %}

        <form method="POST">

            <label>Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Message</label>

            <textarea
                name="message"
                placeholder="Enter your message"
                rows="5"
                required
            ></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </div>

</section>

{% endblock %}
