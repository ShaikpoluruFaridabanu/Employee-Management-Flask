{% extends "base.html" %}


{% block title %}

Login

{% endblock %}


{% block content %}


<section class="login-section">


    <div class="login-card">


        <div class="login-icon">
            👥
        </div>


        <h1>
            Admin Login
        </h1>


        {% if error %}

        <p class="error">
            {{ error }}
        </p>

        {% endif %}


        <form method="POST">


            <label>
                Username
            </label>


            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>
                Password
            </label>


            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">

                Login

            </button>


        </form>


        <div class="login-links">

            <a href="{{ url_for('register') }}">
                Register
            </a>


            <span>|</span>


            <a href="{{ url_for('forgot_password') }}">
    Forgot Password?
</a>

        </div>


    </div>


</section>


{% endblock %}
