{% extends "base.html" %}


{% block title %}

Add Employee

{% endblock %}


{% block content %}


<section class="form-section">


    <div class="employee-form-card">


        <h1>
            Add Employee
        </h1>


        <form method="POST">


            <label>
                Employee Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter employee name"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >


            <label>
                Phone
            </label>

            <input
                type="text"
                name="phone"
                placeholder="Enter phone"
                required
            >


            <label>
                Age
            </label>

            <input
                type="number"
                name="age"
                placeholder="Enter age"
                required
            >


            <label>
                Department
            </label>

            <select name="department" required>

                <option value="">
                    Select Department
                </option>

                <option value="IT">
                    IT
                </option>

                <option value="Finance">
                    Finance
                </option>

                <option value="Marketing">
                    Marketing
                </option>

            </select>


            <button type="submit">

                Add Employee

            </button>


        </form>


    </div>


</section>


{% endblock %}
